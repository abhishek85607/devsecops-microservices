apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
  namespace: devsecops-prod
data:
  DB_HOST: "postgres-service"
  DB_NAME: "appdb"
  REDIS_HOST: "redis-service"
  REDIS_PORT: "6379"

---
apiVersion: v1
kind: Secret
metadata:
  name: app-secret
  namespace: devsecops-prod
type: Opaque
stringData:
  DB_USER: "postgres"
  DB_PASS: "password123"
