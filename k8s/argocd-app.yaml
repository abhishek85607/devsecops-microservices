apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: devsecops-microservices
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/abhishek85607/devsecops-microservices.git
    targetRevision: HEAD
    path: k8s
  destination:
    server: https://kubernetes.default.svc
    namespace: devsecops-prod
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true 
