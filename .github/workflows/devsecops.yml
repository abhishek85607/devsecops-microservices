name: DevSecOps CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  DOCKER_USER: abhishek85607

jobs:
  security-and-lint:
    name: Code Quality & Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Backend Lint & Security Check
        run: |
          pip install flake8 bandit
          flake8 backend/ --max-line-length=120 --exclude=__pycache__
          bandit -r backend/ -ll

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Frontend Dependencies & Audit
        run: |
          cd frontend
          npm ci || npm install
          npm audit --audit-level=high || true

      - name: Trivy Repository File System Scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          ignore-unfixed: true
          format: 'table'
          severity: 'CRITICAL,HIGH'

  build-and-scan-images:
    name: Build, Scan & Push Docker Images
    needs: security-and-lint
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Backend Image Locally for Scan
        run: |
          docker build -t $DOCKER_USER/devsecops-backend:${{ github.sha }} ./backend

      - name: Trivy Scan Backend Image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.DOCKER_USER }}/devsecops-backend:${{ github.sha }}
          format: 'table'
          exit-code: '0'
          severity: 'CRITICAL,HIGH'

      - name: Build Frontend Image Locally for Scan
        run: |
          docker build -t $DOCKER_USER/devsecops-frontend:${{ github.sha }} ./frontend

      - name: Trivy Scan Frontend Image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.DOCKER_USER }}/devsecops-frontend:${{ github.sha }}
          format: 'table'
          exit-code: '0'
          severity: 'CRITICAL,HIGH'

      - name: Push Backend Image
        run: |
          docker tag $DOCKER_USER/devsecops-backend:${{ github.sha }} $DOCKER_USER/devsecops-backend:latest
          docker push $DOCKER_USER/devsecops-backend:${{ github.sha }}
          docker push $DOCKER_USER/devsecops-backend:latest

      - name: Push Frontend Image
        run: |
          docker tag $DOCKER_USER/devsecops-frontend:${{ github.sha }} $DOCKER_USER/devsecops-frontend:latest
          docker push $DOCKER_USER/devsecops-frontend:${{ github.sha }}
          docker push $DOCKER_USER/devsecops-frontend:latest
